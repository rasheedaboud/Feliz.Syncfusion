name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: "10.0.x" }
      - uses: actions/setup-node@v5
        with: { node-version: "24" }
      - run: dotnet tool restore
      - run: dotnet restore Feliz.Syncfusion.sln
      - run: dotnet build Feliz.Syncfusion.sln -c Release --no-restore
      - run: npm install
      - run: npm run fable:build
      - run: npm run verify:exports
      - run: npm run verify:type-safety
      - run: npm run test:unit
      - run: npm run test:crap
      - run: dotnet pack Felize.Syncfusion/Feliz.Syncfusion.fsproj -c Release --no-build -o artifacts/package
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: artifacts/package/*.nupkg
  browser-render:
    name: browser-render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: "10.0.x" }
      - uses: actions/setup-node@v5
        with: { node-version: "24" }
      - run: dotnet tool restore
      - run: dotnet restore Feliz.Syncfusion.sln
      - run: npm install
      - run: npm run fable:build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
  mutation:
    name: mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with: { node-version: "24" }
      - run: npm install
      - run: npm run test:mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation
